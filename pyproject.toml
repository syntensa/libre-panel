[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "libre-panel"
version = "0.6.2"
description = "Free software for USB system-monitor displays (TURZX / Turing Smart Screen and compatibles) with a visual theme editor."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Libre Panel contributors" }]
keywords = ["turzx", "turing-smart-screen", "system-monitor", "lcd", "hardware-monitor", "theme-editor"]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Hardware",
]
dependencies = [
    "pillow>=10.1",
    "psutil>=5.9",
    "numpy>=1.24",  # light, dust and facets: whole layers at a time, cheap enough for 50 fps
    "tzdata; sys_platform == 'win32'",  # time zones for the world clock (Windows has none)
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
usb = ["pyusb>=1.2", "pycryptodome>=3.19", "libusb-package>=1.0"]
tray = ["pystray>=0.19.5"]
# what is playing, on Windows (Linux uses playerctl)
media = [
    "winrt-runtime>=2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2; sys_platform == 'win32'",
]
mqtt = ["paho-mqtt>=2"]
# LibreHardwareMonitor inside Libre Panel on Windows (GPU, temperatures, power, fans), with the
# .NET libraries named by dll_dir (docs/CONFIGURATION.md). 3.0.5 is the first that runs on
# Python 3.13, 3.1 the first on 3.14; the loading it needs is the same in all of 3.x so far.
lhm = ["pythonnet>=3.0.5,<3.3; sys_platform == 'win32'"]
# The app in a window of its own on Windows: pywebview shows it with WebView2, through the
# same pythonnet as LibreHardwareMonitor. Linux uses the system's GTK and WebKit when
# pywebview and PyGObject are there (docs/BACKGROUND.md); without a window, the browser.
window = [
    "pywebview>=6.2,<7; sys_platform == 'win32'",
    "pythonnet>=3.0.5,<3.3; sys_platform == 'win32'",
]
dev = ["pytest>=8", "ruff==0.16.9", "pyserial>=3.5", "pycryptodome>=3.19"]

[project.scripts]
libre-panel = "libre_panel.cli:main"

# Third-party packages can add sensor providers or display drivers without
# touching the core, e.g. an optional fan-analysis plugin.
[project.entry-points."libre_panel.sensors"]
psutil = "libre_panel.sensors.psutil_provider:PsutilProvider"
linux = "libre_panel.sensors.linux:LinuxProvider"
librehardwaremonitor = "libre_panel.sensors.librehardwaremonitor:LibreHardwareMonitorProvider"
load = "libre_panel.sensors.load:LoadProvider"
audio = "libre_panel.sensors.audio:AudioProvider"
demo = "libre_panel.sensors.demo:DemoProvider"
media = "libre_panel.sensors.media:MediaProvider"
calendar = "libre_panel.sensors.calendar:CalendarProvider"
homeassistant = "libre_panel.sensors.homeassistant:HomeAssistantProvider"
mqtt = "libre_panel.sensors.mqtt:MqttProvider"
sky = "libre_panel.sensors.sky:SkyProvider"
presentmon = "libre_panel.sensors.presentmon:PresentMonProvider"
hardware = "libre_panel.sensors.hardware:HardwareProvider"

[project.entry-points."libre_panel.devices"]
auto = "libre_panel.devices.auto:AutoDisplay"
virtual = "libre_panel.devices.virtual:VirtualDisplay"
turzx = "libre_panel.devices.turzx:TurzxDisplay"

[project.urls]
Homepage = "https://github.com/syntensa/libre-panel"
Issues = "https://github.com/syntensa/libre-panel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libre_panel = ["themes/**/*", "editor/static/*", "editor/app/**/*", "pages/web/*", "fonts/*.ttf", "fonts/*.txt", "fonts/*.md", "assets/**/*", "locale/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
