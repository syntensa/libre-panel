[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "libre-panel"
version = "0.9.6rc1"
description = "Free software for USB system-monitor displays (TURZX / Turing Smart Screen and compatibles) with a visual theme editor."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Libre Panel contributors" }]
keywords = ["turzx", "turing-smart-screen", "system-monitor", "lcd", "hardware-monitor", "theme-editor"]
classifiers = [
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Hardware",
]
# (the Python package is the plugin host the Rust app starts for Python plugins and the plugin
# API, tests/without_app.py; the wheels pip and pipx install carry the Rust app beside it,
# packaging/platform_wheel.py)
dependencies = [
    "pillow>=10.1",  # what plugins draw with
    # what plugins have had beside it, as the Python app brought them (the plugin host's
    # download carries them too: packaging/pyinstaller/libre-panel-plugins.spec)
    "psutil>=5.9",
    "numpy>=1.24",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# the tests and the tools beside them (the simulated panels, the clips and pictures they compare)
dev = [
    "pytest>=8",
    "ruff==0.16.9",
    "pyusb>=1.2",
    "pycryptodome>=3.19",
    "jeepney>=0.8",
]

[project.scripts]
# (the plugin host the Rust app starts for Python plugins, beside its programs in an install)
libre-panel-plugins = "libre_panel.plugin_host:main"

[project.urls]
Homepage = "https://github.com/syntensa/libre-panel"
Issues = "https://github.com/syntensa/libre-panel/issues"

[tool.setuptools.packages.find]
where = ["src"]

# (Libre Panel's files, the data folder, go into share/libre-panel: setup.py)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "kept: a comparison whose expectations are the Python app's answers as kept (tests/golden.py)",
    "live: a comparison not checked against kept answers (on the systems named, or on all)",
    "c_library: a comparison whose kept answers hold for CI's C library alone (golden.kept_here)",
]
