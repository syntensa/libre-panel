[package]
name = "libre-panel"
description = "Libre Panel: the program that shows a theme's frames on a panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "libre-panel"
path = "src/main.rs"

[dependencies]
lp-py = { path = "../py" }
lp-pixels = { path = "../pixels" }
lp-text = { path = "../text" }
lp-i18n = { path = "../i18n" }
lp-theme = { path = "../theme" }
lp-config = { path = "../config" }
lp-render = { path = "../render" }
lp-devices = { path = "../devices" }
lp-sensors = { path = "../sensors" }
lp-services = { path = "../services" }
indexmap = "2"
num-bigint = "0.4"
lp-net = { path = "../net" }
# the token of the app's server (access.rs)
getrandom = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# the keyboard shortcuts on X11 (hotkeys.rs): the protocol itself, no libX11
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }

[target.'cfg(windows)'.dependencies]
# the computer's own readings (system.rs), and Ctrl+C
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Wdk_System_SystemInformation",
    "Win32_System_Ioctl",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
