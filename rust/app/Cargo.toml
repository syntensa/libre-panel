[package]
name = "libre-panel"
description = "Libre Panel: the program that shows a theme's frames on a panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lp_app"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "libre-panel"
path = "src/main.rs"

# Windows: the same program without a console window (src/windowed.rs)
[[bin]]
name = "LibrePanel"
path = "src/windowed.rs"

[dependencies]
lp-py = { path = "../py" }
lp-pixels = { path = "../pixels" }
lp-text = { path = "../text" }
lp-i18n = { path = "../i18n" }
lp-theme = { path = "../theme" }
lp-config = { path = "../config" }
lp-render = { path = "../render" }
lp-devices = { path = "../devices" }
lp-decode = { path = "../decode" }
lp-sensors = { path = "../sensors" }
lp-services = { path = "../services" }
indexmap = "2"
num-bigint = "0.4"
sha2 = "0.10"
lp-net = { path = "../net" }
# shared themes' zips (zip.rs)
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# the token of the app's server (access.rs)
getrandom = "0.2"
# the memory's database, read for History (history.rs)
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# the keyboard shortcuts on X11 (hotkeys.rs): the protocol itself, no libX11
x11rb = { version = "0.13", default-features = false, features = ["xtest"] }

[target.'cfg(target_os = "linux")'.dependencies]
# the screen on Wayland (wayland.rs): Mutter's screen cast and the portal on the session bus,
# through libdbus (as the window's tao already links it)
dbus = "0.9"

[target.'cfg(windows)'.dependencies]
# the computer's own readings (system.rs), and Ctrl+C
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Wdk_System_SystemInformation",
    "Win32_System_Ioctl",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
# (the Windows programs' version, icon and manifest: ../winres.rs)
embed-resource = "3"
