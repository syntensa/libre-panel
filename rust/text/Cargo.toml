[package]
name = "lp-text"
description = "Letters as Pillow draws them: FreeType's faces, Pillow's layout and masks, ImageDraw's text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lp-pixels = { path = "../pixels" }
# (FreeType, loaded where the app runs: ft.rs)
libloading = "0.8"
# (Unicode 15.0, as Python 3.12's unicodedata has it, the release's: fallback.rs)
unicode-general-category = "=0.6.0"
unicode-normalization = { version = "=0.1.22", default-features = false, features = ["std"] }
