[package]
name = "lp-check"
description = "Runs Libre Panel's Rust operations it reads, for the comparisons with the Python app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lp-pixels = { path = "../pixels" }
lp-decode = { path = "../decode" }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
