[package]
name = "lp-net"
description = "Libre Panel's web client: a file from an http or https address, as the Python app's urllib fetches one"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# (socks-proxy: a SOCKS proxy the environment or Windows names is gone through; without it
# ureq warns and connects past the proxy)
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier", "socks-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
