[package]
name = "lp-decode"
description = "Pictures from their files as Pillow decodes them: PNG and APNG, GIF, JPEG, WebP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lp-pixels = { path = "../pixels" }
# (zlib-rs: zlib ported, so that inflating stops where Pillow's zlib stops)
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# (zlib-rs with its "std": it looks for the processor's AVX2 and SSE when it runs, for its
# checksum and its copies; flate2 asks for none. The same bytes either way.)
zlib-rs = { version = "0.6.7", default-features = false, features = ["std"] }
# (libjpeg-turbo, loaded where the app runs: jpeg.rs)
libloading = "0.8"
