[package]
name = "lp-sensors"
description = "Libre Panel's sensor sources: LibreHardwareMonitor through the sensor service, the names of the hardware"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lp-py = { path = "../py" }
lp-render = { path = "../render" }
lp-i18n = { path = "../i18n" }
lp-devices = { path = "../devices" }
lp-pixels = { path = "../pixels" }
lp-decode = { path = "../decode" }
lp-net = { path = "../net" }
num-bigint = "0.4"
roxmltree = "0.20"
indexmap = "2"
num-traits = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_WinRT",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Wdk_System_SystemInformation",
    "Win32_System_Performance",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
] }
