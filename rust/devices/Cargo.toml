[package]
name = "lp-devices"
description = "The panels Libre Panel drives: their catalog (devices/models.py) and their drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lp-py = { path = "../py" }
lp-pixels = { path = "../pixels" }
lp-decode = { path = "../decode" }
lp-i18n = { path = "../i18n" }
# (the TURZX panels on the bus, without libusb: usbfs on Linux, WinUSB on Windows, as the
# engine has them)
nusb = "0.2.9"
# (PNG files: zlib as lp-decode has it)
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Devices_Communication",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_System_Registry",
    "Win32_System_IO",
    "Win32_UI_Shell",
] }
