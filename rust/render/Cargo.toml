lp-theme = { path = "../theme" }
lp-text = { path = "../text" }
lp-i18n = { path = "../i18n" }
indexmap = "2"
unicode-general-category = "=0.6.0"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
