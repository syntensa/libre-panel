[package]
name = "lp-render"
description = "Libre Panel's renderer: the frames of a theme, widget by widget, as render/ draws them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lp-py = { path = "../py" }
lp-pixels = { path = "../pixels" }
