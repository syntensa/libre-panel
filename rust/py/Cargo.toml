[package]
name = "lp-py"
description = "Python's ways the app's files and messages depend on: str's repr, white space, digits, rounding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# (Unicode 15.0, as Python 3.12's unicodedata has it, the release's)
unicode-general-category = "=0.6.0"
# a dict's order, and ints of any size
indexmap = "2"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"

# (os.path.normcase on Windows: the system's own small letters, as Python's ntpath takes them)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
