name: CI

on:
  push:
    branches-ignore: ["handoff/**"]  # mailbox branches carry only notes
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.9  # keep in sync with the dev extra
      - run: ruff check .
      - run: ruff format --check .

  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,usb,tray]"
      - name: ffmpeg for the video mode tests
        if: runner.os != 'macOS'  # Homebrew's ffmpeg takes too long; macOS skips those tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then choco install ffmpeg -y --no-progress; else sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          ffmpeg -hide_banner -encoders | grep libx264
      - run: pytest -q -rs
      - name: Render the built-in themes
        run: |
          libre-panel preview libre-default -o libre-default.png
          libre-panel preview spur-ii -o spur-ii.png

  desktop:
    # The editor in a real browser and the tray icon on a real X11 tray.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y xvfb stalonetray
      - run: pip install -e ".[dev,tray]" playwright
      - run: python -m playwright install --with-deps chromium
      - name: Theme editor in a browser, tray icon on X11
        run: pytest -q -rs tests/test_editor_browser.py tests/test_tray.py
