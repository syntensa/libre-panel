name: Release

on:
  push:
    tags: ["v*"]
  # By hand (Actions -> Release -> Run workflow): build and test the release files; with a
  # version, they become a draft release of it that only who may write to the repository sees
  # (a release candidate to try), else nothing is published.
  workflow_dispatch:
    inputs:
      draft:
        description: "Version for a draft release (e.g. 0.7.0rc2); empty: only build and test"
        required: false
        default: ""
      from_run:
        description: "With a draft: the CI run (its id) whose downloads it carries, built and tried there; empty: built and tried anew"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.draft != ''
        env:
          TAG: ${{ inputs.draft != '' && format('v{0}', inputs.draft) || github.ref_name }}
        run: |
          version=$(python -c "from importlib.metadata import version; print(version('libre-panel'))")
          if [ "v$version" != "$TAG" ]; then
            echo "::error::tag $TAG, but the package version is $version"
            exit 1
          fi
          grep -q "^## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section $version"; exit 1; }

  python-package:
    timeout-minutes: 15
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  app:
    # Libre Panel in Rust, built and tried as CI builds and tries it on every push (ci.yml): the
    # Windows setup and portable zip (its job `try`: the setup installed for all users with every
    # box, run and uninstalled), the Linux AppImage and archive (its job `appimage`: started as
    # autostart starts it, with and without a tray; the archive unpacked and drawn from), after
    # every comparison with the Python app and every test
    needs: test
    # (not where a draft carries the downloads of a CI run that built and tried them: from_run)
    if: ${{ !inputs.from_run }}
    uses: ./.github/workflows/ci.yml

  github-release:
    timeout-minutes: 15
    needs: [python-package, app]
    if: >-
      !cancelled() && needs.python-package.result == 'success' &&
      (needs.app.result == 'success' || (inputs.from_run && needs.app.result == 'skipped')) &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.draft != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read  # (the downloads of the CI run a draft carries: from_run)
      id-token: write  # (GitHub's signature on where each file was built: the attestations)
      attestations: write
    env:
      TAG: ${{ inputs.draft != '' && format('v{0}', inputs.draft) || github.ref_name }}
      DRAFT: ${{ inputs.draft }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: artifacts
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.from_run }}
        with:
          name: libre-panel-rust-setup
          path: artifacts
      - uses: actions/download-artifact@v4
        if: ${{ !inputs.from_run }}
        with:
          name: libre-panel-rust-appimage
          path: artifacts
      # (a draft of the downloads a CI run built and tried: its jobs `try` and `appimage`)
      - uses: actions/download-artifact@v4
        if: ${{ inputs.from_run }}
        with:
          name: libre-panel-rust-setup
          path: artifacts
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.from_run }}
        with:
          name: libre-panel-rust-appimage
          path: artifacts
          run-id: ${{ inputs.from_run }}
          github-token: ${{ github.token }}
      - name: The files under the names the app's "Update to" looks for
        # (updates.py and rust/app's updates: -windows-x64-setup.exe, -windows-x64-portable.zip,
        # -x86_64.AppImage, -linux-x64.tar.gz; CI's AppImage says "rust" in its name)
        run: |
          version="${TAG#v}"
          mv "artifacts/Libre_Panel-$version-rust-x86_64.AppImage" "artifacts/Libre_Panel-$version-x86_64.AppImage"
          for end in windows-x64-setup.exe windows-x64-portable.zip linux-x64.tar.gz; do
            test -f "artifacts/libre-panel-$version-$end"
          done
          ls -l artifacts
      - name: Release notes from CHANGELOG.md
        # the version's section; a hotfix's (0.9.1) goes on with the sections of the releases
        # it follows down to the one it fixes (0.9.0), each under its heading, so that who comes
        # from an older version reads all that is new (the app shows the first paragraph)
        run: |
          version="${TAG#v}"
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
          minor=""
          case "$version" in
            *[!0-9.]* | *.*.*.*) ;;
            *.*.*) [ "${version##*.}" = 0 ] || minor="${version%.*}" ;;
          esac
          awk -v v="$version" -v m="$minor" '
            function heading(line, w) { return index(line, "## " w " ") == 1 || line == "## " w }
            function of_minor(line, rest) {
              if (m == "" || index(line, "## " m ".") != 1) return 0
              rest = substr(line, length("## " m ".") + 1)
              sub(/ .*/, "", rest)
              return rest ~ /^[0-9]+$/
            }
            /^## / {
              if (found && !last && of_minor($0)) { last = heading($0, m ".0"); print; next }
              if (found) exit
              if (heading($0, v)) { found = 1; next }
            }
            found { print }
          ' CHANGELOG.md | sed -E "s#\]\((docs/|[A-Z]+\.md)#](${base}/\1#g" > notes.md
          test -s notes.md
          printf '\n**Which file?** Windows: `…-setup.exe`, Linux: `….AppImage`; see [Install](https://github.com/%s#install-and-first-start).\n' "$GITHUB_REPOSITORY" >> notes.md
      - name: SHA-256 sums of the files
        # SHA256SUMS among the release's files, as sha256sum writes it: the app's "Update to"
        # checks its download against it (editor/updates.py), anyone can (sha256sum -c)
        run: |
          (cd artifacts && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS artifacts/
          cat artifacts/SHA256SUMS
      - name: Where each file was built (attestations)
        if: ${{ !inputs.from_run }}
        # GitHub signs for each file, in public (Sigstore), that this workflow built it from
        # this commit of this repository: `gh attestation verify FILE --repo
        # syntensa/libre-panel` checks a download against it (README's FAQ)
        uses: actions/attest@v4
        with:
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.AppImage
            artifacts/*.tar.gz
            artifacts/*.whl
      - name: Publish the release with all files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          pre=false
          case "${TAG#v}" in *a*|*b*|*rc*|*dev*) pre=true; flags+=(--prerelease) ;; esac
          title="Libre Panel $TAG"
          if [ -n "$DRAFT" ]; then
            # by hand: a draft, which only who may write to the repository sees with its files,
            # made anew on each run; "Publish release" on its page makes it public and its tag
            drafted=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft \
                      --jq .isDraft 2>/dev/null || echo none)
            if [ "$drafted" = false ]; then
              echo "::error::$TAG is published already"
              exit 1
            elif [ "$drafted" = true ]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
            fi
            gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "$title" --notes-file notes.md "${flags[@]}"
          elif gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # made on github.com together with its tag: fill it in
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file notes.md "${flags[@]}"
          else
            # a pre-release (0.7.0rc1) is a draft: only who may write to the repository sees
            # it and its files, until it is published by hand
            if [ "$pre" = true ]; then flags+=(--draft); fi
            gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$title" --notes-file notes.md "${flags[@]}"
          fi

  pypi:
    # Only once PyPI is set up (docs/RELEASING.md): repository variable PYPI_UPLOAD = true.
    timeout-minutes: 15
    needs: [python-package, app]
    # (not a pre-release: on PyPI everyone would have it)
    if: >-
      startsWith(github.ref, 'refs/tags/v') && vars.PYPI_UPLOAD == 'true' &&
      !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') &&
      !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  forget-the-files:
    # The files are only ever in a release: a run keeps none of them. (On a public repository
    # anyone signed in to GitHub may download a run's files, a release candidate's too.) After
    # the release and PyPI, whether they ran or not.
    if: always()
    needs: [test, python-package, app, github-release, pypi]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete the files of this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[].id' | while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
          done
