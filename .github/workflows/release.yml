name: Release

on:
  push:
    tags: ["v*"]
  # Build and smoke-test the release files without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,usb,tray]"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "from importlib.metadata import version; print(version('libre-panel'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but the package version is $version"
            exit 1
          fi
          grep -q "^## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section $version"; exit 1; }
      - run: pytest -q

  python-package:
    timeout-minutes: 15
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  standalone:
    # Build, package and test on each system: the program folder, then what
    # people download (Windows setup, macOS disk image, Linux AppImage), which
    # is installed, started as autostart/double-click would, and removed.
    timeout-minutes: 45
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ".[usb,serial,tray]" pyinstaller
      - name: Version
        shell: bash
        run: |
          version=$(python -c "from importlib.metadata import version; print(version('libre-panel'))")
          numeric=$(python -c "import re, sys; n = re.findall(r'\d+', sys.argv[1])[:3]; print('.'.join((n + ['0'] * 3)[:3]) + '.0')" "$version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NUMERIC=$numeric" >> "$GITHUB_ENV"
          case "${{ runner.os }}" in
            Windows) echo "CLI=dist/libre-panel/libre-panel.exe" >> "$GITHUB_ENV"
                     echo "GUI=dist/libre-panel/LibrePanel.exe" >> "$GITHUB_ENV" ;;
            macOS)   echo "CLI=dist/Libre Panel.app/Contents/MacOS/libre-panel" >> "$GITHUB_ENV"
                     echo "GUI=dist/Libre Panel.app/Contents/MacOS/LibrePanel" >> "$GITHUB_ENV" ;;
            Linux)   echo "CLI=dist/libre-panel/libre-panel" >> "$GITHUB_ENV"
                     echo "GUI=dist/libre-panel/libre-panel" >> "$GITHUB_ENV" ;;
          esac
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/libre-panel.spec
      - name: Smoke test (render)
        shell: bash
        run: '"$CLI" preview spur-ii -o smoke.png'
      - name: Smoke test (background app, started as at login)
        shell: bash
        run: python packaging/smoke_test.py "$GUI" tray --background

      - name: Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md dist/libre-panel/
          7z a "dist/libre-panel-$env:VERSION-windows-x64-portable.zip" ./dist/libre-panel/*
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "/DNumericVersion=$env:NUMERIC" packaging\windows\libre-panel.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the Windows setup (install, run, uninstall)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python packaging/windows/test_installer.py "dist/libre-panel-$env:VERSION-windows-x64-setup.exe"

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: packaging/macos/build_dmg.sh "dist/libre-panel-$VERSION-macos-arm64.dmg"
      - name: Test the disk image (mount, run, double-click, quit)
        if: runner.os == 'macOS'
        run: packaging/macos/test_app.sh "dist/libre-panel-$VERSION-macos-arm64.dmg"

      - name: Linux AppImage and archive
        if: runner.os == 'Linux'
        run: |
          cp LICENSE README.md dist/libre-panel/
          tar -C dist -czf "dist/libre-panel-$VERSION-linux-x64.tar.gz" libre-panel
          packaging/linux/build_appimage.sh "$VERSION" "dist/Libre_Panel-$VERSION-x86_64.AppImage"
      - name: Test the AppImage (headless and on an X11 tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb stalonetray
          packaging/linux/test_appimage.sh "dist/Libre_Panel-$VERSION-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/*.AppImage

  github-release:
    timeout-minutes: 15
    needs: [python-package, standalone]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | sed -E "s#\]\((docs/|[A-Z]+\.md)#](${base}/\1#g" > notes.md
          test -s notes.md
          printf '\n**Which file?** Windows: `…-setup.exe`, macOS: `….dmg`, Linux: `….AppImage`; see [Install](https://github.com/%s#install).\n' "$GITHUB_REPOSITORY" >> notes.md
      - name: Publish the release with all files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME#v}" in *a*|*b*|*rc*|*dev*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Libre Panel $GITHUB_REF_NAME" --notes-file notes.md "${flags[@]}"

  pypi:
    # Only once PyPI is set up (docs/RELEASING.md): repository variable PYPI_UPLOAD = true.
    timeout-minutes: 15
    needs: [python-package, standalone]
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_UPLOAD == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
