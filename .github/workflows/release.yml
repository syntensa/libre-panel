name: Release

on:
  push:
    tags: ["v*"]
  # Build and smoke-test the release files without publishing anything.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,usb,tray]"
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "from importlib.metadata import version; print(version('libre-panel'))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but the package version is $version"
            exit 1
          fi
          grep -q "^## $version" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section $version"; exit 1; }
      - run: pytest -q

  python-package:
    timeout-minutes: 15
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  standalone:
    # Build, package and test on each system: the program folder, then what
    # people download (Windows setup, Linux AppImage), which is installed,
    # started as autostart/double-click would, and removed.
    timeout-minutes: 60
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          # the oldest Ubuntu still offered: an AppImage takes glibc from the system it runs
          # on, so it is built against the oldest one it is meant for (the AppImage catalog
          # tests on the oldest LTS still in standard support; test_appimage.sh checks it)
          - os: ubuntu-22.04
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ".[usb,serial,tray,media,mqtt]" pyinstaller
      - name: Version
        shell: bash
        run: |
          version=$(python -c "from importlib.metadata import version; print(version('libre-panel'))")
          # four numbers for Windows: a hotfix's (0.6.8.1) as it is, 0.6.8 and 0.7.0rc1 with a 0
          numeric=$(python -c "import re, sys; v = sys.argv[1]; n = re.findall(r'\d+', v)[:4 if re.fullmatch(r'[\d.]+', v) else 3]; print('.'.join((n + ['0'] * 4)[:4]))" "$version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "NUMERIC=$numeric" >> "$GITHUB_ENV"
          case "${{ runner.os }}" in
            Windows) echo "CLI=dist/libre-panel/libre-panel.exe" >> "$GITHUB_ENV"
                     echo "GUI=dist/libre-panel/LibrePanel.exe" >> "$GITHUB_ENV" ;;
            Linux)   echo "CLI=dist/libre-panel/libre-panel" >> "$GITHUB_ENV"
                     echo "GUI=dist/libre-panel/libre-panel" >> "$GITHUB_ENV" ;;
          esac
      - name: LibreHardwareMonitor libraries and the app's window (Windows)
        # From NuGet, each package checked against the SHA-256 pinned in the script; they
        # are not in the repository. The spec bundles them, with pythonnet, which pywebview
        # (the app's window, WebView2) uses too.
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pip install ".[lhm,window]"
          python packaging/windows/fetch_lhm.py
      - name: ffmpeg, PresentMon and PawnIO's installer
        # From the pages of their projects, each file checked against the SHA-256 pinned in the
        # script, ffmpeg also against the licence it is passed on under (GPL, with libx264, not
        # non-free); they are not in the repository. The spec puts them next to the program
        # as "tools". Windows: ffmpeg, PresentMon and PawnIO's installer; Linux: ffmpeg.
        shell: bash
        run: python packaging/fetch_tools.py
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/pyinstaller/libre-panel.spec
      - name: Smoke test (render)
        shell: bash
        run: '"$CLI" preview spur-ii -o smoke.png'
      - name: Smoke test (ffmpeg and PresentMon in the program folder)
        # Every file is the one that was fetched; ffmpeg lists libx264 and encodes the video
        # mode's stream; PresentMon starts; the app, started from this folder, finds them there
        # before anything on the PATH.
        shell: bash
        run: python packaging/check_tools.py dist/libre-panel
      - name: Smoke test (LibreHardwareMonitor in the bundle)
        # Loads the bundled libraries through pythonnet and opens them. Needs no
        # administrator rights; the CPU's sensors being out of reach is not a failure.
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: '"$CLI" sensors --check-lhm'
      - name: Smoke test (the sensor service in the bundle)
        # The service's own program, in "sensors" with only what it needs, opens
        # LibreHardwareMonitor on every kind of hardware and says what it finds. As a service,
        # installed by the setup, it is tested in test_installer.py below.
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: dist/libre-panel/sensors/libre-panel-sensors.exe --check
      - name: Smoke test (the app's window in the bundle)
        # Finds pywebview's WinForms backend with WebView2 and starts the .NET Framework,
        # without opening a window (there is no desktop here). A runner without the WebView2
        # runtime is said in the output; the build is what is tested.
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: '"$CLI" window --check'
      - name: Smoke test (the app's window opens)
        # A real window, minimized, with the options the app's own window starts with, until
        # its page has loaded: --check alone only proves that the backend loads (0.5.0's window
        # passed it and then died at once on every PC, at an icon .NET could not use).
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: bash
        run: '"$CLI" window --check --open'
      - name: Smoke test (serial and USB libraries in the bundle)
        shell: bash
        run: |
          out=$("$CLI" devices 2>&1)
          echo "$out"
          if grep -q "is not installed" <<<"$out"; then exit 1; fi
      - name: Smoke test (background app, started as at login)
        shell: bash
        run: python packaging/smoke_test.py --tools "$GUI" tray --background

      - name: Windows setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md, NOTICE.md dist/libre-panel/
          7z a "dist/libre-panel-$env:VERSION-windows-x64-portable.zip" ./dist/libre-panel/*
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" "/DNumericVersion=$env:NUMERIC" packaging\windows\libre-panel.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test the Windows setup (install, run, uninstall)
        # for all users with every task: the sensor service is installed, started, read
        # through (as a plain user too, where the runner's logon allows) and removed again
        if: runner.os == 'Windows'
        shell: pwsh
        run: python packaging/windows/test_installer.py "dist/libre-panel-$env:VERSION-windows-x64-setup.exe"

      - name: Linux AppImage and archive
        if: runner.os == 'Linux'
        run: |
          cp LICENSE README.md NOTICE.md dist/libre-panel/
          tar -C dist -czf "dist/libre-panel-$VERSION-linux-x64.tar.gz" libre-panel
          packaging/linux/build_appimage.sh "$VERSION" "dist/Libre_Panel-$VERSION-x86_64.AppImage"
      - name: Test the AppImage (headless and on an X11 tray)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb stalonetray
          packaging/linux/test_appimage.sh "dist/Libre_Panel-$VERSION-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.tar.gz
            dist/*.AppImage

  github-release:
    timeout-minutes: 15
    needs: [python-package, standalone]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "## " v " ") == 1 || $0 == "## " v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md | sed -E "s#\]\((docs/|[A-Z]+\.md)#](${base}/\1#g" > notes.md
          test -s notes.md
          printf '\n**Which file?** Windows: `…-setup.exe`, Linux: `….AppImage`; see [Install](https://github.com/%s#install-and-first-start).\n' "$GITHUB_REPOSITORY" >> notes.md
      - name: Publish the release with all files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          pre=false
          case "${GITHUB_REF_NAME#v}" in *a*|*b*|*rc*|*dev*) pre=true; flags+=(--prerelease) ;; esac
          title="Libre Panel $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # made on github.com together with its tag: fill it in
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file notes.md "${flags[@]}"
          else
            # a pre-release (0.7.0rc1) is a draft: only who may write to the repository sees
            # it and its files, until it is published by hand
            if [ "$pre" = true ]; then flags+=(--draft); fi
            gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "$title" --notes-file notes.md "${flags[@]}"
          fi

  pypi:
    # Only once PyPI is set up (docs/RELEASING.md): repository variable PYPI_UPLOAD = true.
    timeout-minutes: 15
    needs: [python-package, standalone]
    # (not a pre-release: on PyPI everyone would have it)
    if: >-
      startsWith(github.ref, 'refs/tags/v') && vars.PYPI_UPLOAD == 'true' &&
      !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') &&
      !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'dev')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no stored token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
