name: Website

# Publishes site/ (English, and German in site/de) with the pictures from docs/images and the
# clips from docs/media to GitHub Pages once Pages is on (Settings → Pages → Source: GitHub
# Actions); until then the build runs and the deploy is skipped. The clips are made for each
# release (docs/RELEASING.md): without them the build fails and the site stays as it was.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/**"
      - "docs/media/**"
      - "tools/check_pages.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    outputs:
      enabled: ${{ steps.pages.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5
      - name: Is GitHub Pages on?
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Put the site together
        # site/ with images/ (docs/images), media/ (docs/media), the icon and the fonts the
        # stylesheet names; then every file a page names must be there, and nothing is loaded
        # from another site.
        run: python tools/check_pages.py --build _site
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
