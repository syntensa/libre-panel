# A "Share a theme" issue (.github/ISSUE_TEMPLATE/share_theme.yml) becomes a pull request that
# puts the theme among the community themes (community/themes). What comes from the issue is
# looked into only in the first job, which may write nothing; the second takes what it left,
# checks it again as data and opens the pull request. A person looks at it before it is merged.
# Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
#
# Every such pull request adds its entry at the end of the list (community/themes/index.json), so
# one that is merged leaves the others in conflict. When the list changes on main, the themes
# that still wait are therefore made anew on it (`again`); by hand for one of them: Actions →
# Community theme → Run workflow, with the number of its issue.
name: Community theme

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue:
        description: "The number of the theme's issue (its pull request is made anew on main)"
        required: true
        type: number
  push:
    branches: [main]
    paths: ["community/themes/index.json"]

concurrency:
  group: community-theme-${{ github.event.issue.number || inputs.issue || 'list' }}
  cancel-in-progress: true

jobs:
  again:
    # the list changed on main: each theme whose pull request is still open goes through
    # `check` and `add` once more, on the new list (a run of this workflow for its issue)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      issues: read
      pull-requests: read
    steps:
      - name: Make the waiting themes' pull requests anew
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/pulls?state=open&base=main&per_page=100" --jq '.[].head.ref' |
            sed -n 's#^community/theme-\([0-9][0-9]*\)$#\1#p' |
            while read -r number; do
              # (a theme whose issue was closed meanwhile keeps its pull request as it is)
              if [ "$(gh api "repos/$GH_REPO/issues/$number" --jq .state < /dev/null)" = "open" ]; then
                gh workflow run community-theme.yml --ref main -f issue="$number" < /dev/null
              fi
            done

  check:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.issue.state == 'open' &&
      (contains(github.event.issue.labels.*.name, 'community theme') || startsWith(github.event.issue.title, 'Theme:')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - name: The issue's text and who opened it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ inputs.issue }}
          BODY: ${{ github.event.issue.body }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          if [ "$EVENT" = "issues" ]; then
            printf '%s' "$BODY" > "$RUNNER_TEMP/issue.md"
            printf '%s' "$LOGIN" > "$RUNNER_TEMP/login"
          else  # made anew: the issue as it is now, which must still be a theme's and open
            gh api "repos/$GH_REPO/issues/$NUMBER" > "$RUNNER_TEMP/issue.json"
            jq -e '.state == "open" and (has("pull_request") | not) and
                   (([.labels[].name] | index("community theme")) != null or (.title | startswith("Theme:")))' \
              "$RUNNER_TEMP/issue.json" > /dev/null
            jq -j '.body // ""' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/issue.md"
            jq -j '.user.login' "$RUNNER_TEMP/issue.json" > "$RUNNER_TEMP/login"
          fi
      - name: Check the theme and draw its picture
        run: |
          python tools/community_theme.py check --issue "$RUNNER_TEMP/issue.md" --login "$(cat "$RUNNER_TEMP/login")" --out "$RUNNER_TEMP/checked"
      - uses: actions/upload-artifact@v4
        with:
          name: checked
          path: ${{ runner.temp }}/checked
          retention-days: 3

  add:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - uses: actions/download-artifact@v4
        with:
          name: checked
          path: ${{ runner.temp }}/checked
      - name: Put it beside the list and open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || inputs.issue }}
          LOGIN: ${{ github.event.issue.user.login }}
          USER_ID: ${{ github.event.issue.user.id }}
        run: |
          if [ "$EVENT" != "issues" ]; then  # made anew: who opened the issue is asked for
            LOGIN=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq '.user.login')
            USER_ID=$(gh api "repos/$GITHUB_REPOSITORY/issues/$NUMBER" --jq '.user.id')
          fi
          if ! id=$(python tools/community_theme.py add --checked "$RUNNER_TEMP/checked" --number "$NUMBER" \
              --pull-request "$RUNNER_TEMP/pr.md" --refusal "$RUNNER_TEMP/refusal.md"); then
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/refusal.md"
            exit 0
          fi
          branch="community/theme-$NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add community/themes
          # the one who shared it as the commit's author: among the contributors once merged
          author=()
          if [[ "$LOGIN" =~ ^[A-Za-z0-9-]+$ && "$USER_ID" =~ ^[0-9]+$ ]]; then
            author=(--author "$LOGIN <$USER_ID+$LOGIN@users.noreply.github.com>")
          fi
          git commit -q "${author[@]}" -m "Community theme: $id (#$NUMBER)"
          git push -q --force origin "$branch"
          url=$(gh pr list --head "$branch" --state open --json url --jq '.[0].url // ""')
          if [ -z "$url" ]; then
            url=$(gh pr create --base main --head "$branch" --title "Community theme: $id" --body-file "$RUNNER_TEMP/pr.md")
          else
            gh pr edit "$url" --body-file "$RUNNER_TEMP/pr.md"
          fi
          if [ "$EVENT" != "issues" ]; then  # made anew: the issue was told when it was first made
            exit 0
          fi
          printf 'Thanks! Your theme passed the check and waits for a look: %s\n\nOnce it is merged, it shows in everyone'"'"'s app under *Start → Themes → Community themes* (within the hour).\n' "$url" > "$RUNNER_TEMP/comment.md"
          gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
