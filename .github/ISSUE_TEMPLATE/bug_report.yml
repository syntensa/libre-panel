name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: panel
    attributes:
      label: Panel
      description: Model id from `libre-panel models`, or the product name
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS, Other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Libre Panel version
      description: Output of `libre-panel --version`
  - type: textarea
    id: log
    attributes:
      label: Log output
      description: Run the command with `-v` and paste the output. Remove anything personal.
      render: text
